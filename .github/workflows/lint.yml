name: Lint

on:
  push:
    branches: [main]
    paths:
      - grammar.js
      - scripts/**
      - eslint.config.mjs
      - package.json
  pull_request:
    paths:
      - grammar.js
      - scripts/**
      - eslint.config.mjs
      - package.json

jobs:
  lint:
    name: Lint grammar.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: lts/*
      - name: Install modules
        run: npm ci --legacy-peer-deps
      - name: Run ESLint
        run: npm run lint
